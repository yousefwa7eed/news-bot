name: News Bot

on:
  schedule:
    - cron: "*/10 * * * *"   # كل 10 دقايق
  workflow_dispatch:          # يخليك تشغّله يدوي من GitHub لو حبيت تجربه فوراً

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_news.py

      - name: Handle button feedback
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python handle_feedback.py

      - name: Save state back to repo
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push
